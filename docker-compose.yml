services:
  db:
    image: postgres:15-alpine
    container_name: etl-postgres
    restart: always
    environment:
      # Pega as credenciais do seu arquivo .env, ou usa um valor padrão se não existir
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-etl_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-etl_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: etl-bancos-extratos
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # A classe Database.py lê as variáveis DB_*.
      # Aqui nós sobrescrevemos o DB_HOST para o nome do container do banco ('db') em vez de localhost
      DB_HOST: db
    # Volumes podem ser úteis para persistir/acessar as credenciais e arquivos extraídos sem precisar rebuildar a imagem
    volumes:
      - ./creds.json:/app/creds.json
      - ./client_secret.json:/app/client_secret.json
      - ./arquivos:/app/arquivos

volumes:
  pgdata:
